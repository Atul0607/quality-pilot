[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-pilot"
version = "0.1.0"
description = "Docker-native end-to-end test reliability CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
e2e = [
    "playwright==1.55.0",
    "pytest==8.4.2",
    "pytest-playwright==0.7.1",
    "pytest-html==4.1.1",
    "requests==2.32.5",
]
lint = ["ruff==0.12.10"]

[project.scripts]
quality-pilot = "quality_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/quality-pilot" = ["demo/dashboard_runs.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "demo/tests"]
markers = [
    "smoke: core user journeys that should pass on every build",
    "regression: feature and validation coverage",
    "reliability: environment isolation and repeatability checks",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
